<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — NutriVeda</title>
<meta name="description" content="Premium nutrition products from NutriVeda - Natural, FSSAI Certified health products.">
<meta name="robots" content="index, follow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/reviews.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  /* Product Image Gallery — override base .pd-visual */
  .pd-visual {
    position: sticky;
    top: 90px;
    background: none !important;
    border: none !important;
    height: auto !important;
    display: block !important;
    font-size: initial !important;
    border-radius: 0 !important;
  }
  .pd-main-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--cream-light, #fefcf5);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-size: 8rem;
    border: 1px solid rgba(200,150,12,.12);
  }
  .pd-main-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
  }
  .pd-image-thumbs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 14px;
  }
  .pd-thumb {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    border: 2px solid #e0e0e0;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    background: var(--cream-light, #fefcf5);
  }
  .pd-thumb.active { border-color: var(--forest); border-width: 3px; }
  .pd-thumb:hover { border-color: var(--gold); transform: translateY(-2px); }
  .pd-thumb img { width: 100%; height: 100%; object-fit: cover; }

  @media (max-width: 900px) {
    .pd-visual { position: relative !important; top: 0 !important; height: auto !important; }
    .pd-image-thumbs { grid-template-columns: repeat(4, 1fr); }
  }
  
  /* Accordion */
  .pd-accordion { margin-top: 24px; border-top: 1px solid #eee; }
  .pd-accordion-item { border-bottom: 1px solid #eee; }
  .pd-accordion-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; cursor: pointer; font-weight: 600; font-size: 15px; color: var(--text-dark); }
  .pd-accordion-header:hover { color: var(--forest); }
  .pd-accordion-item.open .pd-accordion-header [data-lucide] { transform: rotate(180deg); }
  .pd-accordion-body { padding: 0 0 16px; }
  .pd-benefits-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .pd-benefits-list li { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-mid); }
  .pd-shipping-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--text-mid); }
  .pd-shipping-list li { padding: 4px 0; }
  
  /* Trust badges with icons */
  .pd-trust { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee; }
  .pd-trust-item { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-mid); background: var(--cream-light, #fefcf5); padding: 8px 12px; border-radius: 8px; }
  
  /* Sticky Add to Cart Bar */
  .sticky-cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px 5%; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); z-index: 100; transform: translateY(100%); transition: transform 0.3s ease; }
  .sticky-cart-bar.visible { transform: translateY(0); }
  .sticky-cart-info { display: flex; flex-direction: column; }
  .sticky-cart-name { font-size: 13px; font-weight: 600; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .sticky-cart-price { font-size: 16px; font-weight: 700; color: var(--forest); }
  .sticky-cart-btn { padding: 12px 28px; background: var(--forest); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: background 0.2s; }
  .sticky-cart-btn:hover { background: #1e4030; }
  
  @media (min-width: 900px) { .sticky-cart-bar { display: none; } }
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>

<nav id="navbar">
  <a href="../index.html" class="nav-logo">Nutri<span>Veda</span></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="products.html">Products</a></li>
    <li><a href="../index.html#why-us">About</a></li>
    <li><a href="../index.html#contact">Contact</a></li>
    <li><a href="cart.html" class="nav-cart"><i data-lucide="shopping-cart" style="width:16px;height:16px;"></i> <span id="cartCount">0</span></a></li>
    <li><a href="products.html" class="nav-cta">Shop More</a></li>
  </ul>
  <div style="display:flex;align-items:center;gap:16px;">
    <a href="cart.html" class="nav-cart-mobile"><i data-lucide="shopping-cart" style="width:16px;height:16px;"></i> <span id="cartCountMobile">0</span></a>
    <div class="hamburger" id="hamburger" onclick="toggleNav()"><span></span><span></span><span></span></div>
  </div>
</nav>

<div id="productContent" style="padding-top:72px;"></div>

<div id="reviewsSection"></div>
<div id="relatedSection"></div>
<div id="footer-placeholder"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/data.js"></script>
<script src="../js/common.js?v=2"></script>
<script src="../js/reviews.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'));
  let product = null;

  function renderProductPage() {
    product = PRODUCTS.find(p => p.id === id);

  if(!product) {
    document.getElementById('productContent').innerHTML = `
      <div style="text-align:center;padding:120px 5%;">
        <div style="font-size:4rem;margin-bottom:20px;">🔍</div>
        <h2 style="font-family:'Playfair Display',serif;color:var(--forest);margin-bottom:12px;">Product Not Found</h2>
        <a href="products.html" class="btn-primary" style="display:inline-flex;">Browse All Products</a>
      </div>`;
  } else {
    document.title = product.name + ' — NutriVeda | ' + product.category;
    
    // Update meta description dynamically
    let metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute('content', product.desc);
    
    // Inject schema.org Product structured data
    const schemaScript = document.createElement('script');
    schemaScript.type = 'application/ld+json';
    schemaScript.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Product",
      "name": product.name,
      "description": product.desc,
      "image": "https://nutriveda.shop/assets/product-" + product.id + ".jpg",
      "brand": { "@type": "Brand", "name": "NutriVeda" },
      "sku": "NV" + String(product.id).padStart(3, '0'),
      "category": product.category,
      "offers": {
        "@type": "Offer",
        "url": window.location.href,
        "priceCurrency": "INR",
        "price": product.price,
        "availability": "https://schema.org/InStock",
        "itemCondition": "https://schema.org/NewCondition"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": product.rating.toString(),
        "reviewCount": product.reviews.toString(),
        "bestRating": "5",
        "worstRating": "1"
      }
    });
    document.head.appendChild(schemaScript);
    
    const disc = Math.round((1 - product.price/product.mrp)*100);
    const starsHtml = '★'.repeat(Math.floor(product.rating)) + (product.rating % 1 ? '½' : '');

    // Image gallery: supports up to 8 images per product
    const imgBase = '../assets/products/product-' + product.id;
    const mainImg = `<img src="${imgBase}-1.jpg" alt="${product.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none;">${product.emoji}</span>`;
    const thumbs = [1,2,3,4,5,6,7,8].map(n => 
      `<div class="pd-thumb${n===1?' active':''}" data-img="${n}" onclick="switchImage(${n})"><img src="${imgBase}-${n}.jpg" alt="${product.name} ${n}" onerror="this.parentElement.style.display='none'"></div>`
    ).join('');

    document.getElementById('productContent').innerHTML = `
      <div class="page-header">
        <div class="breadcrumb">
          <a href="../index.html">Home</a> ›
          <a href="products.html">Products</a> ›
          <a href="products.html?cat=${product.catKey}">${product.category}</a> ›
          <span>${product.name}</span>
        </div>
      </div>
      <section class="product-detail">
        <div class="pd-grid">
          <div class="pd-visual">
            <div class="pd-main-image" id="pdMainImage">${mainImg}</div>
            <div class="pd-image-thumbs">${thumbs}</div>
          </div>
          <div class="pd-info">
            <div class="pd-cat">${product.category}</div>
            <h1 class="pd-name">${product.name}</h1>
            <div class="pd-rating">
              <div class="pd-stars">${'★'.repeat(Math.floor(product.rating))}${product.rating % 1 >= 0.5 ? '½' : ''}</div>
              <div class="pd-review-count">${product.rating}/5 · ${product.reviews} reviews</div>
            </div>
            <div class="pd-price-row">
              <div class="pd-price">₹${product.price.toLocaleString()}</div>
              <div class="pd-mrp">₹${product.mrp.toLocaleString()}</div>
              <div class="pd-savings">Save ${disc}%</div>
            </div>
            <p class="pd-desc">${product.desc}</p>
            <div class="pd-tags">
              ${product.tags.map(t => `<span class="pd-tag">${t}</span>`).join('')}
            </div>
            <div class="pd-qty-row">
              <div class="pd-qty-label">Quantity:</div>
              <div class="qty-ctrl">
                <button class="qty-btn" onclick="changeQty(-1)">−</button>
                <div class="qty-val" id="qtyVal">1</div>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
              </div>
            </div>
            <div class="pd-actions">
              <button class="btn-buy-now" onclick="buyNow()">Buy Now — ₹${product.price.toLocaleString()}</button>
              <button class="btn-cart-full" onclick="addProductToCart()">+ Add to Cart</button>
            </div>
            
            <!-- Accordion Sections -->
            <div class="pd-accordion">
              <div class="pd-accordion-item open">
                <div class="pd-accordion-header" onclick="toggleAccordion(this)">
                  <span>Key Benefits</span>
                  <i data-lucide="chevron-down" style="width:18px;height:18px;transition:transform 0.3s;"></i>
                </div>
                <div class="pd-accordion-body">
                  <ul class="pd-benefits-list">${product.benefits.map(b => `<li><i data-lucide="check-circle" style="width:14px;height:14px;color:var(--forest);flex-shrink:0;"></i> ${b}</li>`).join('')}</ul>
                </div>
              </div>
              <div class="pd-accordion-item">
                <div class="pd-accordion-header" onclick="toggleAccordion(this)">
                  <span>How to Use</span>
                  <i data-lucide="chevron-down" style="width:18px;height:18px;transition:transform 0.3s;"></i>
                </div>
                <div class="pd-accordion-body" style="display:none;">
                  <p style="font-size:14px;color:var(--text-mid);line-height:1.7;">
                    Take as directed on the packaging or as advised by a health professional. 
                    Store in a cool, dry place away from direct sunlight. Best consumed within 6 months of opening.
                  </p>
                </div>
              </div>
              <div class="pd-accordion-item">
                <div class="pd-accordion-header" onclick="toggleAccordion(this)">
                  <span>Shipping & Returns</span>
                  <i data-lucide="chevron-down" style="width:18px;height:18px;transition:transform 0.3s;"></i>
                </div>
                <div class="pd-accordion-body" style="display:none;">
                  <ul class="pd-shipping-list">
                    <li><strong>Free shipping</strong> on orders above ₹999</li>
                    <li>Delivery within <strong>2-5 business days</strong> across India</li>
                    <li><strong>7-day return policy</strong> for unopened products</li>
                    <li>Cash on Delivery available (₹40 COD fee)</li>
                  </ul>
                </div>
              </div>
            </div>
            
            <div class="pd-trust">
              <div class="pd-trust-item"><i data-lucide="shield-check" style="width:16px;height:16px;"></i> FSSAI Certified</div>
              <div class="pd-trust-item"><i data-lucide="truck" style="width:16px;height:16px;"></i> Free shipping ₹999+</div>
              <div class="pd-trust-item"><i data-lucide="refresh-cw" style="width:16px;height:16px;"></i> 7-day returns</div>
              <div class="pd-trust-item"><i data-lucide="lock" style="width:16px;height:16px;"></i> Secure payment</div>
            </div>
          </div>
        </div>
      </section>
      
      <!-- Sticky Add to Cart Bar (mobile) -->
      <div class="sticky-cart-bar" id="stickyCartBar">
        <div class="sticky-cart-info">
          <span class="sticky-cart-name">${product.name}</span>
          <span class="sticky-cart-price">₹${product.price.toLocaleString()}</span>
        </div>
        <button class="sticky-cart-btn" onclick="addProductToCart()">Add to Cart</button>
      </div>
    `;

    // Related products
    const related = PRODUCTS.filter(p => p.catKey === product.catKey && p.id !== product.id).slice(0, 3);
    if(related.length > 0) {
      document.getElementById('relatedSection').innerHTML = `
        <section style="padding:60px 5%;background:var(--cream-dark);">
          <div class="section-header reveal">
            <div class="section-tag">You May Also Like</div>
            <h2 class="section-title">Related <em>Products</em></h2>
          </div>
          <div class="all-products-grid">
            ${related.map(p => `
              <div class="aprod-card reveal">
                <div class="aprod-img">${p.emoji}<div class="aprod-badge">${p.badge}</div></div>
                <div class="aprod-body">
                  <div class="aprod-category">${p.category}</div>
                  <div class="aprod-name">${p.name}</div>
                  <div class="aprod-desc">${p.desc}</div>
                  <div class="aprod-footer">
                    <div class="aprod-price">₹${p.price.toLocaleString()} <small>₹${p.mrp.toLocaleString()}</small></div>
                    <div class="aprod-actions">
                      <a href="product.html?id=${p.id}" class="btn-aprod-view">View</a>
                      <button class="btn-aprod-add" onclick="addToCartById(${p.id}, this)">+ Cart</button>
                    </div>
                  </div>
                </div>
              </div>`).join('')}
          </div>
        </section>`;
      initReveal();
    }

    // Render product reviews once the product is resolved
    if (product && typeof ProductReviews !== 'undefined') {
      ProductReviews.render('reviewsSection', product.id, product);
    }
    if (typeof lucide !== 'undefined') lucide.createIcons();
  } // end renderProductPage

  function safeRender() {
    const el = document.getElementById('productContent');
    try {
      if (typeof PRODUCTS === 'undefined' || !PRODUCTS.length) {
        if (el) el.innerHTML = '<div style="text-align:center;padding:120px 5%;"><h2 style="color:var(--forest);">Loading product…</h2></div>';
        return;
      }
      renderProductPage();
    } catch (e) {
      console.error('[NutriVeda] product render failed:', e);
      if (el) {
        el.innerHTML = '<div style="text-align:center;padding:120px 5%;">'
          + '<h2 style="color:var(--forest);margin-bottom:12px;">Something went wrong</h2>'
          + '<p style="color:#888;max-width:600px;margin:0 auto 20px;">' + (e && e.message ? e.message : e) + '</p>'
          + '<a href="products.html" class="btn-primary" style="display:inline-flex;">Browse All Products</a></div>';
      }
    }
  }

  // Wait for products to load from Supabase (fallback to local data.js), then render.
  // Also render immediately if PRODUCTS is already populated (data.js loaded).
  if (window.NV_PRODUCTS_READY && typeof window.NV_PRODUCTS_READY.then === 'function') {
    window.NV_PRODUCTS_READY.then(safeRender).catch(safeRender);
    // Safety net: if the promise hangs, render from local data after a short delay
    setTimeout(function () {
      const el = document.getElementById('productContent');
      if (el && !el.innerHTML.trim() && typeof PRODUCTS !== 'undefined' && PRODUCTS.length) {
        safeRender();
      }
    }, 1500);
  } else {
    safeRender();
  }

  let qty = 1;
  function changeQty(delta) {
    qty = Math.max(1, qty + delta);
    const el = document.getElementById('qtyVal');
    if(el) el.textContent = qty;
  }

  function addProductToCart() {
    const cart = getCart();
    const existing = cart.find(i => i.id === product.id);
    if(existing) existing.qty += qty;
    else cart.push({ id:product.id, name:product.name, price:product.price, mrp:product.mrp, emoji:product.emoji, category:product.category, qty });
    saveCart(cart);
    showToast(`${qty}x ${product.name} added to cart! 🛒`);
  }

  function buyNow() {
    addProductToCart();
    window.location.href = 'cart.html';
  }
  
  // Accordion toggle
  function toggleAccordion(header) {
    const item = header.parentElement;
    const body = header.nextElementSibling;
    const icon = header.querySelector('[data-lucide]');
    const isOpen = item.classList.contains('open');
    
    if (isOpen) {
      item.classList.remove('open');
      body.style.display = 'none';
      if (icon) icon.style.transform = 'rotate(0deg)';
    } else {
      item.classList.add('open');
      body.style.display = 'block';
      if (icon) icon.style.transform = 'rotate(180deg)';
    }
  }
  
  // Switch product image in gallery
  function switchImage(num) {
    const imgBase = '../assets/products/product-' + product.id;
    const mainContainer = document.getElementById('pdMainImage');
    if (mainContainer) {
      mainContainer.innerHTML = `<img src="${imgBase}-${num}.jpg" alt="${product.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none;">${product.emoji}</span>`;
    }
    // Update active thumb by data-img attribute
    document.querySelectorAll('.pd-thumb').forEach(t => {
      t.classList.toggle('active', parseInt(t.dataset.img) === num);
    });
  }
  
  // Sticky Add to Cart bar on mobile scroll
  window.addEventListener('scroll', function() {
    const bar = document.getElementById('stickyCartBar');
    if (!bar) return;
    if (window.scrollY > 400) {
      bar.classList.add('visible');
    } else {
      bar.classList.remove('visible');
    }
  });
</script>
</body>
</html>
