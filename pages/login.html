<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register — NutriVeda</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  body { background: var(--cream); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-container { width: 100%; max-width: 420px; }
  .login-card { background: white; border-radius: 20px; padding: 40px 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
  .login-logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: var(--forest); text-align: center; margin-bottom: 4px; }
  .login-logo span { color: var(--gold); }
  .login-subtitle { text-align: center; color: var(--text-light); font-size: 0.85rem; margin-bottom: 28px; }
  .login-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--forest); margin-bottom: 6px; }
  .login-desc { color: var(--text-light); font-size: 0.88rem; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dark); margin-bottom: 6px; }
  .form-input { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 14px; transition: border-color 0.2s; font-family: 'DM Sans', sans-serif; box-sizing: border-box; }
  .form-input:focus { border-color: var(--forest); outline: none; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-submit { width: 100%; padding: 14px; background: var(--forest); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
  .btn-submit:hover { background: #1e4030; transform: translateY(-1px); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-secondary { width: 100%; padding: 12px; background: none; border: 1.5px solid #ddd; border-radius: 10px; color: var(--text-mid); font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
  .btn-secondary:hover { border-color: var(--forest); color: var(--forest); }
  .toggle-link { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-light); }
  .toggle-link a { color: var(--forest); font-weight: 600; text-decoration: none; }
  .toggle-link a:hover { text-decoration: underline; }
  .status-message { padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
  .status-success { background: #d4edda; color: #155724; display: block; }
  .status-error { background: #f8d7da; color: #721c24; display: block; }
  .back-link { text-align: center; margin-top: 20px; }
  .back-link a { color: var(--text-light); font-size: 13px; text-decoration: none; }
  .back-link a:hover { color: var(--forest); }
  .hidden { display: none !important; }
  .password-toggle { position: relative; }
  .password-toggle input { padding-right: 44px; }
  .password-toggle button { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 18px; }
  .phone-input-group { display: flex; gap: 8px; }
  .country-code { width: 56px; text-align: center; background: var(--cream); font-weight: 600; border: 1.5px solid #e0e0e0; border-radius: 10px; padding: 12px 8px; font-size: 14px; }
  .terms-text { font-size: 12px; color: var(--text-light); text-align: center; margin-top: 16px; }
  .terms-text a { color: var(--forest); }
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e0e0e0; }
  .divider span { font-size: 12px; color: var(--text-light); font-weight: 600; }
</style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-logo">Nutri<span>Veda</span></div>
    <div class="login-subtitle">Pure Nutrition, Powerful Life</div>

    <div id="statusMessage" class="status-message"></div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="login-title">Welcome Back</div>
      <p class="login-desc">Login to your account</p>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-toggle">
            <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required minlength="6">
            <button type="button" onclick="togglePassword('loginPassword', this)">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="loginBtn">Login</button>
      </form>

      <div class="toggle-link">
        Don't have an account? <a href="#" onclick="showRegister()">Register</a>
      </div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" class="hidden">
      <div class="login-title">Create Account</div>
      <p class="login-desc">Register once, login easily every time</p>

      <form onsubmit="handleRegister(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name *</label>
            <input type="text" id="regFirstName" class="form-input" placeholder="First name" required minlength="2">
          </div>
          <div class="form-group">
            <label class="form-label">Last Name *</label>
            <input type="text" id="regLastName" class="form-input" placeholder="Last name" required minlength="2">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" id="regEmail" class="form-input" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Number (Optional)</label>
          <div class="phone-input-group">
            <input type="text" class="country-code" value="+91" readonly>
            <input type="tel" id="regPhone" class="form-input" placeholder="10-digit number" pattern="[0-9]{10}" maxlength="10">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Create Password *</label>
          <div class="password-toggle">
            <input type="password" id="regPassword" class="form-input" placeholder="Min 6 characters" required minlength="6">
            <button type="button" onclick="togglePassword('regPassword', this)">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <div class="password-toggle">
            <input type="password" id="regConfirmPassword" class="form-input" placeholder="Re-enter password" required minlength="6">
            <button type="button" onclick="togglePassword('regConfirmPassword', this)">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="registerBtn">Create Account</button>

        <p class="terms-text">
          By registering, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
        </p>
      </form>

      <div class="toggle-link">
        Already have an account? <a href="#" onclick="showLogin()">Login</a>
      </div>
    </div>

    <div class="back-link">
      <a href="../index.html">← Back to Home</a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-client.js"></script>
<script>
  // ── UI HELPERS ──
  function showLogin() {
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('registerForm').classList.add('hidden');
    clearStatus();
  }

  function showRegister() {
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('registerForm').classList.remove('hidden');
    clearStatus();
  }

  function showStatus(msg, type) {
    const el = document.getElementById('statusMessage');
    el.textContent = msg;
    el.className = 'status-message status-' + type;
  }

  function clearStatus() {
    document.getElementById('statusMessage').className = 'status-message';
  }

  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁';
    }
  }

  function getReturnUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('returnUrl') ? decodeURIComponent(params.get('returnUrl')) : '../index.html';
  }

  // ── REGISTRATION ──
  async function handleRegister(e) {
    e.preventDefault();

    const firstName = document.getElementById('regFirstName').value.trim();
    const lastName = document.getElementById('regLastName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('regConfirmPassword').value;

    if (password !== confirmPassword) {
      showStatus('Passwords do not match', 'error');
      return;
    }

    if (password.length < 6) {
      showStatus('Password must be at least 6 characters', 'error');
      return;
    }

    const btn = document.getElementById('registerBtn');
    btn.textContent = 'Creating account...';
    btn.disabled = true;

    try {
      if (!supabaseClient) throw new Error('Service unavailable. Please try again.');

      // 1. Create Supabase Auth user
      const { data: authData, error: authError } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            first_name: firstName,
            last_name: lastName,
            phone: phone
          }
        }
      });

      if (authError) {
        if (authError.message.includes('already registered')) {
          showStatus('This email is already registered. Please login instead.', 'error');
          btn.textContent = 'Create Account';
          btn.disabled = false;
          return;
        }
        throw authError;
      }

      // 2. Create customer profile in customers table
      if (authData.user) {
        await supabaseClient.from('customers').upsert({
          id: authData.user.id,
          email: email,
          first_name: firstName,
          last_name: lastName,
          phone: phone || null
        });
      }

      // 3. Store session locally for nav display
      localStorage.setItem('nv_user_email', email);
      localStorage.setItem('nv_user_first_name', firstName);
      localStorage.setItem('nv_user_last_name', lastName);
      localStorage.setItem('nv_user_phone', phone || '');
      localStorage.setItem('nv_user_logged_in', 'true');
      localStorage.setItem('nv_user_login_time', new Date().toISOString());

      // 4. Merge guest cart/wishlist
      if (typeof CartAPI !== 'undefined') await CartAPI.mergeGuestCart(authData.user.id);
      if (typeof WishlistAPI !== 'undefined') await WishlistAPI.mergeGuestWishlist(authData.user.id);

      showStatus('Account created successfully! Redirecting...', 'success');

      setTimeout(() => { window.location.href = getReturnUrl(); }, 1200);

    } catch (err) {
      showStatus(err.message || 'Registration failed. Please try again.', 'error');
      btn.textContent = 'Create Account';
      btn.disabled = false;
    }
  }

  // ── LOGIN ──
  async function handleLogin(e) {
    e.preventDefault();

    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;

    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Logging in...';
    btn.disabled = true;

    try {
      if (!supabaseClient) throw new Error('Service unavailable. Please try again.');

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        if (error.message.includes('Invalid login')) {
          throw new Error('Invalid email or password. Please try again.');
        }
        throw error;
      }

      // Get user profile from customers table
      const { data: profile } = await supabaseClient
        .from('customers')
        .select('*')
        .eq('id', data.user.id)
        .maybeSingle();

      const firstName = profile?.first_name || data.user.user_metadata?.first_name || '';
      const lastName = profile?.last_name || data.user.user_metadata?.last_name || '';
      const phone = profile?.phone || data.user.user_metadata?.phone || '';

      // Store session locally for nav display
      localStorage.setItem('nv_user_email', email);
      localStorage.setItem('nv_user_first_name', firstName);
      localStorage.setItem('nv_user_last_name', lastName);
      localStorage.setItem('nv_user_phone', phone);
      localStorage.setItem('nv_user_logged_in', 'true');
      localStorage.setItem('nv_user_login_time', new Date().toISOString());

      // Merge guest cart/wishlist into account
      if (typeof CartAPI !== 'undefined') await CartAPI.mergeGuestCart(data.user.id);
      if (typeof WishlistAPI !== 'undefined') await WishlistAPI.mergeGuestWishlist(data.user.id);

      showStatus('Login successful! Redirecting...', 'success');

      setTimeout(() => { window.location.href = getReturnUrl(); }, 1000);

    } catch (err) {
      showStatus(err.message || 'Login failed. Please try again.', 'error');
      btn.textContent = 'Login';
      btn.disabled = false;
    }
  }

  // ── AUTO-REDIRECT IF ALREADY LOGGED IN ──
  (async function checkSession() {
    if (!supabaseClient) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      // Already logged in, redirect
      window.location.href = getReturnUrl();
    }
  })();
</script>
</body>
</html>
